<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>まゆりの木 初回体験バナー 1080×1080（サンプル）</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{position:relative;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;color:#4d3e36;background:#f8f1e7}
.bg{position:absolute;inset:0}
.top{position:absolute;left:0;right:0;top:66px;text-align:center}
.top p{font-size:37px;font-weight:600}
.top h1{margin-top:20px;font-size:112px;font-weight:600;line-height:1.28;letter-spacing:.01em}
.price{position:absolute;left:70px;top:446px}
.price .was{font-size:36px;color:#75635a}
.price .was s{text-decoration-thickness:3px}
.price .now{display:flex;align-items:baseline;color:#a4505c;line-height:1.08;font-weight:600}
.price .now b{font-size:190px;letter-spacing:-.03em;font-weight:600}
.price .now span{font-size:66px;margin-left:6px}
.price .tax{font-size:34px;margin-top:4px}
.chips{position:absolute;left:70px;top:796px;display:flex;gap:14px}
.chips span{background:#fffdf9;border-radius:999px;padding:9px 26px;font-size:32px;font-weight:600;white-space:nowrap}
.band{position:absolute;left:0;right:0;bottom:0;height:172px;background:#a4505c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.band b{font-size:50px;font-weight:600;line-height:1.3}
.band small{font-size:24px;color:#fbe6e4}
.brand{position:absolute;left:70px;bottom:192px;font-size:27px;font-weight:600}
.brand small{font-size:21px;font-weight:400;margin-left:14px;color:#75635a}
</style>
</head>
<body>
<svg class="bg" width="1080" height="1080" viewBox="0 0 1080 1080" aria-hidden="true">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e3df"/><stop offset="1" stop-color="#f0cfca"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b7b1"/><stop offset="1" stop-color="#d98f90"/></linearGradient>
  </defs>
  <circle cx="1040" cy="30" r="280" fill="#f0cfca" opacity=".55"/>
  <circle cx="30" cy="330" r="150" fill="#efe3d3"/>
  <circle cx="838" cy="660" r="262" fill="url(#p)"/>
  <!-- 抱っこのシルエット -->
  <g transform="translate(628 484) scale(.96)">
    <path d="M60 460c6-150 60-234 160-234s154 84 160 234Z" fill="url(#b)"/>
    <circle cx="220" cy="142" r="58" fill="#f6dccb"/>
    <path d="M160 146c-6-60 34-84 66-82 40 2 66 34 56 84-10-26-34-44-58-46-26-2-50 16-64 44Z" fill="#6e5245"/>

    <path d="M106 262C118 344 204 376 306 326" fill="none" stroke="#c97f82" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="226" cy="298" rx="78" ry="48" transform="rotate(-14 226 298)" fill="#fffdf9"/>
    <circle cx="272" cy="266" r="33" fill="#f6dccb"/>
    <path d="M242 258c6-22 44-30 62-6-16-8-40-8-62 6Z" fill="#6e5245"/>
  </g>
  <rect y="908" width="1080" height="172" fill="#a4505c"/>

<div class="top">
  <p>抱っこの腰、授乳の肩に</p>
  <h1>産後ケア整体<br>初回体験</h1>
</div>
<div class="price">
  <div class="was">通常 <s>6,600円</s></div>
  <div class="now"><b>3,300</b><span>円</span></div>
  <div class="tax">60分・税込</div>
</div>
<div class="chips"><span>赤ちゃん同伴OK</span><span>完全個室</span></div>
<div class="band"><b>11月30日まで　WEB予約受付中</b><small>産後ケア整体院 まゆりの木　※架空店舗のサンプル広告です</small></div>
</body>
</html>
