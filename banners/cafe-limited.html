<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Harbor Bean 期間限定メニューバナー 1200×628（サンプル）</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:628px;overflow:hidden}
body{position:relative;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:#fcf7ef;background:#0f2233}
.bg{position:absolute;inset:0}
.copy{position:absolute;left:510px;top:50px;width:650px}
.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:.02em}
.tag{display:inline-block;margin-top:38px;background:#e9a26d;color:#0f2233;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:800;font-size:29px;letter-spacing:.1em;padding:4px 18px}
h1{margin-top:26px;font-weight:600;font-size:72px;line-height:1.3;white-space:nowrap}
h1 small{display:block;font-size:50px;letter-spacing:.06em;font-weight:500;margin-bottom:2px}
.meta{margin-top:40px;display:flex;align-items:center;gap:30px}
.meta b{font-family:Georgia,serif;font-weight:400;font-size:62px;line-height:1;color:#ffd9a8}
.until{display:flex;align-items:baseline;gap:8px}.until em{font-style:normal;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:700;font-size:30px}.yen{font-family:Georgia,serif;font-size:62px;line-height:1;border-left:2px solid rgba(252,247,239,.5);padding-left:30px;color:#fcf7ef}
.note{position:absolute;left:510px;bottom:20px;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;color:#cdd6dc}
</style>
</head>
<body>
<svg class="bg" width="1200" height="628" viewBox="0 0 1200 628" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2233"/><stop offset=".5" stop-color="#26405a"/><stop offset=".72" stop-color="#a65d4c"/><stop offset=".84" stop-color="#eda26a"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2233" stop-opacity="0"/><stop offset=".32" stop-color="#0f2233" stop-opacity=".82"/><stop offset="1" stop-color="#0f2233" stop-opacity=".94"/></linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#f0dcc0"/></linearGradient>
    <linearGradient id="latte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a673"/><stop offset=".55" stop-color="#a86a3c"/><stop offset="1" stop-color="#6c3c1d"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".2" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="sunGlow"><stop offset="0" stop-color="#ffdca9" stop-opacity=".9"/><stop offset="1" stop-color="#ffdca9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#sky)"/>
  <circle cx="400" cy="510" r="280" fill="url(#sunGlow)"/>
  <circle cx="400" cy="514" r="56" fill="#ffe2b8"/>
  <path d="M0 520c40-26 90-34 140-14 40-24 80-20 120 14ZM330 520c26-20 70-24 100-8 40-12 90-6 130 8Z" fill="#2a3346"/>
  <rect y="518" width="1200" height="110" fill="#17324a"/>
  <path d="M0 562c70-14 140-14 210 0s140 14 210 0 140-14 210 0 140 14 210 0 140-14 210 0 110 10 150 6v60H0Z" fill="#0f2437"/>
  <rect x="440" width="760" height="628" fill="url(#fade)"/>
  <g transform="translate(200 0)">
    <ellipse cx="0" cy="582" rx="130" ry="14" fill="#000" opacity=".35"/>
    <!-- 中身 -->
    <path d="M-104 132H104L84 562a24 24 0 0 1-24 22H-60a24 24 0 0 1-24-22Z" fill="url(#latte)"/>
    <path d="M-104 132H104L97 282c-34 18-62-12-98 4-36 16-58-6-94 2Z" fill="url(#milk)"/>
    <!-- 塩キャラメルのソース -->
    <g fill="none" stroke="#c9732a" stroke-width="9" stroke-linecap="round"><path d="M-78 138c-2 30 2 62-2 92"/><path d="M-24 138c2 40-2 80 2 118"/><path d="M34 138c-2 34 2 54-2 84"/><path d="M78 138c-2 22 0 42-2 66"/></g>
    <!-- クリーム -->
    <path d="M-112 132c-22-34 8-66 40-58-2-34 42-58 74-38 30-16 74 6 68 42 34-2 58 30 38 54Z" fill="#fff8ec"/>
    <path d="M-84 118L-40 92 0 118 44 86 84 112" fill="none" stroke="#c9732a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 塩粒 -->
    <g fill="#fff"><circle cx="-40" cy="60" r="4"/><circle cx="14" cy="46" r="4"/><circle cx="52" cy="76" r="4"/><circle cx="-14" cy="84" r="3"/></g>
    <!-- ガラス -->
    <path d="M-112 124H112L90 566a30 30 0 0 1-30 28H-60a30 30 0 0 1-30-28Z" fill="url(#glass)" stroke="#fcf7ef" stroke-opacity=".55" stroke-width="4"/>
  </g>
</svg>
<div class="copy">
  <div class="logo">Harbor Bean</div>
  <div><span class="tag">冬の期間限定</span></div>
  <h1><small>潮風の</small>塩キャラメルラテ</h1>
  <div class="meta"><div class="until"><b>12.25</b><em>まで</em></div><span class="yen">¥680</span></div>
</div>
<div class="note">※架空店舗のサンプル広告です</div>
</body>
</html>
