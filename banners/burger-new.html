<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EMBER STACK 新作告知バナー 1200×628（サンプル）</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:628px;overflow:hidden}
body{position:relative;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;color:#fff8e8;background:#17110d}
.bg{position:absolute;inset:0}
.copy{position:absolute;left:58px;top:44px;width:680px}
.logo{font-family:"Arial Black",Impact,sans-serif;font-size:27px;letter-spacing:.08em}
.logo i{font-style:normal;color:#ffb627}
.new{display:inline-block;margin-top:44px;background:#ffb627;color:#17110d;font-family:"Arial Black",Impact,sans-serif;font-size:32px;letter-spacing:.06em;padding:3px 20px;transform:skewX(-8deg)}
h1{margin-top:18px;font-weight:900;font-size:94px;line-height:1.16;letter-spacing:-.015em}
h1 em{font-style:normal;color:#ffb627}
.date{margin-top:36px;display:flex;align-items:center;gap:22px}
.date b{font-family:"Arial Black",Impact,sans-serif;font-weight:900;font-size:58px;line-height:1;letter-spacing:-.01em}
.date b small{font-size:27px;margin-left:8px;color:#ffb627}
.date span{font-size:32px;font-weight:800}
.note{position:absolute;left:58px;bottom:20px;font-size:15px;color:#c9baa6}
.price{position:absolute;right:24px;bottom:24px;width:172px;height:172px;border-radius:50%;background:#d7301f;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);border:4px solid #fff8e8}
.price span{font-size:20px;font-weight:800}
.price b{font-family:"Arial Black",Impact,sans-serif;font-size:42px;line-height:1.1;letter-spacing:-.02em}
</style>
</head>
